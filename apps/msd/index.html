<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- title, description and robots are per-page tags from <Seo> (apps/msd/src/app/seo/seo.tsx);
         React 19 hoists them into <head> but never removes a static tag, so none live here. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    />
    <!-- Material Symbols (M3 icons) are self-hosted via the `material-symbols`
         package, imported in @skylabs-monorepo/shared-ui/theme.css. -->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
