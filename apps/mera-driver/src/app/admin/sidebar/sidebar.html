<aside class="admin-sidebar" [class.is-open]="open()" [attr.aria-hidden]="open() ? null : 'true'" [attr.inert]="open() ? null : ''">
  <md-icon-button class="md-sidebar-mobile-close" aria-label="Close navigation" title="Close navigation" (click)="close.emit()"><md-icon aria-hidden="true">close</md-icon></md-icon-button>
  <div class="admin-sidebar__brand">
    <span class="admin-sidebar__logo">
      <md-icon aria-hidden="true">directions_car</md-icon>
    </span>
    <span>
      <div class="admin-sidebar__brand-name">mera-driver</div>
      <div class="admin-sidebar__brand-sub">Driver console</div>
    </span>
  </div>

  <input
    class="admin-sidebar__search"
    type="search"
    [value]="search()"
    (input)="search.set($any($event.target).value)"
    placeholder="Search…"
    aria-label="Search"
  />

  <nav class="admin-sidebar__nav" aria-label="Console">
    <ng-container [ngTemplateOutlet]="tree" [ngTemplateOutletContext]="{ nodes: menu() }"></ng-container>
    <ng-template #tree let-nodes="nodes">
      @for (node of nodes; track node.id) {
        @if (node.children?.length) {
          <div class="admin-nav-group">
            <button type="button" class="admin-nav-item w-full" [attr.aria-expanded]="isGroupExpanded(node)" (click)="toggleGroup(node)">
              <md-icon aria-hidden="true">{{ node.icon }}</md-icon>
              <span>{{ node.title }}</span>
              <md-icon aria-hidden="true">{{ isGroupExpanded(node) ? 'expand_less' : 'expand_more' }}</md-icon>
            </button>
            @if (isGroupExpanded(node)) {
              <div class="pl-3">
                <ng-container [ngTemplateOutlet]="tree" [ngTemplateOutletContext]="{ nodes: node.children }"></ng-container>
              </div>
            }
          </div>
        } @else {
          <a class="admin-nav-item" [routerLink]="(accountPath(node) || '').split('?')[0]" [queryParams]="queryParams(node)" [class.active]="isActive(node)" [attr.aria-current]="isActive(node) ? 'page' : null">
            <md-icon aria-hidden="true">{{ node.icon }}</md-icon>{{ node.title }}
          </a>
        }
      }
    </ng-template>
  </nav>

  <div class="admin-sidebar__user">
    <span class="admin-sidebar__avatar">{{ initial() }}</span>
    <span class="admin-sidebar__user-info">
      <div class="admin-sidebar__user-name" [title]="user()?.name || ''">{{ user()?.name ?? 'Loading…' }}</div>
      <div class="admin-sidebar__user-mail" [title]="roleNames()">{{ roleNames() }}</div>
    </span>
    <div class="sidebar-user-actions">
      <md-icon-button
        aria-label="My Profile"
        title="My Profile"
        [class.active]="isOnProfile()"
        (click)="goToProfile()"
      >
        <md-icon aria-hidden="true">person</md-icon>
      </md-icon-button>
      <md-icon-button aria-label="Log out" title="Log out" (click)="signOut()">
        <md-icon aria-hidden="true">logout</md-icon>
      </md-icon-button>
    </div>
  </div>
</aside>
