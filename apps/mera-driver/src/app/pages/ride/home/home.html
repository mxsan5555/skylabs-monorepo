<section class="rider-map-screen" aria-labelledby="home-title">
  <div class="rider-map">
    <md-ride-map
      [pickup]="booking.pickup()?.coord ?? null"
      label="Map showing your current pickup location"
    ></md-ride-map>

    <md-filled-button class="rider-share" (click)="shareLocation()">
      <md-icon slot="icon" aria-hidden="true">near_me</md-icon>
      Share current location
    </md-filled-button>
  </div>

  <div class="rider-sheet">
    <div class="rider-sheet__handle" aria-hidden="true"></div>
    <h1 id="home-title" class="rider-sheet__title">Plan your ride</h1>

    <div class="rider-route relative">
      <div class="rider-route__rail" aria-hidden="true">
        <span class="rider-route__dot"></span>
        <span class="rider-route__line"></span>
        <span class="rider-route__dot rider-route__dot--square"></span>
      </div>
      <div class="w-full flex flex-col gap-1">
        <md-location-picker
          type="pickup"
          placeholder="Enter pickup"
          [value]="booking.pickup()?.label ?? ''"
          (placeSelected)="onPickupSelected($event)"
        ></md-location-picker>

        <md-location-picker
          type="drop"
          placeholder="Where to?"
          [value]="booking.drop()?.label ?? ''"
          (placeSelected)="onDropSelected($event)"
        ></md-location-picker>
      </div>
    </div>

    @if (booking.recentPlaces.length > 0) {
      <h2 class="rider-eyebrow">Recent destinations</h2>
      <ul class="rider-list">
        @for (place of booking.recentPlaces; track place.id) {
          <li>
            <button type="button" class="rider-row" (click)="chooseDrop(place)">
              <span class="rider-row__icon">
                <md-icon aria-hidden="true">location_on</md-icon>
              </span>
              <span class="rider-row__body">
                <span class="rider-row__title">{{ place.label }}</span>
                <span class="rider-row__sub">{{ place.address }}</span>
              </span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
</section>
