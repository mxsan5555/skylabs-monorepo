<div class="not-found">
  <p class="not-found__code">403</p>
  <h1>{{ missingLink() ? 'Portal profile not linked' : "You don't have access to this" }}</h1>
  @if (missingLink()) { <p role="alert">{{ missingLink() }}</p> }
  <p>Your account doesn't have permission to view that page. If you think this is a mistake, contact your administrator.</p>
  <md-filled-button (click)="goToDashboard()">Back to dashboard</md-filled-button>
</div>
