<md-admin-page title="My Profile" subtitle="Keep your details up to date. Verification status can only be changed by staff.">
  @if (loading()) {
    <p class="otp-muted">Loading…</p>
  } @else {
    <section class="account-card">
      <div class="account-card__head">
        <h2>Personal details</h2>
        @if (saved()) {
          <span class="otp-muted" role="status">Saved</span>
        }
      </div>
      @if (error()) {
        <p class="otp-muted" role="alert">{{ error() }}</p>
      }
      <div class="address-form">
        @for (f of fields; track f.key) {
          <md-outlined-text-field
            [class.span-2]="f.span2"
            [label]="f.label"
            [type]="f.type ?? 'text'"
            [value]="draft()[f.key] ?? ''"
            (input)="setField(f.key, $any($event.target).value)"
          ></md-outlined-text-field>
        }
      </div>
    </section>

    <div>
      <md-filled-button [disabled]="saving()" (click)="save()">
        {{ saving() ? 'Saving…' : 'Save changes' }}
      </md-filled-button>
    </div>
  }
</md-admin-page>
