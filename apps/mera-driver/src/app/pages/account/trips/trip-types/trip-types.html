<md-admin-page
  [title]="showAddForm() ? (editingId() !== null && editingId() !== 'new' ? 'Edit Trip Type' : 'Add Trip Type') : 'Trip Types'"
  [subtitle]="showAddForm() ? (editingId() !== null && editingId() !== 'new' ? 'Edit trip type details' : 'Add a new trip type') : 'Configure one-way, round-trip, hourly, and outstation packages.'"
>
  <div class="relative w-full">
    @if (!showAddForm()) {
      <div class="w-full mt-4">
        <sky-card class="p-6 block">
          <sky-data-table
            [columns]="tableColumns"
            [rows]="tableRowsString()"
            [total]="list().length"
            selectable exportable searchable
            [actions]="tableActions"
            (sky-dt-row-action)="onRowAction($event)"
            caption="Trip Types Database"
          >
            <md-icon-button slot="toolbar-actions" aria-label="Add Trip Type" title="Add Trip Type" (click)="startAdd()">
              <md-icon>add</md-icon>
            </md-icon-button>
          </sky-data-table>
        </sky-card>
      </div>
    } @else {
      <div class="flex flex-col gap-6 w-full mt-2">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <div class="text-xs text-slate-500 font-semibold tracking-wide">
            Home / <span class="text-[#2e7d32]">{{ editingId() !== null && editingId() !== 'new' ? 'Edit Trip Type' : 'Add Trip Type' }}</span>
          </div>
          <md-outlined-button (click)="cancelEdit()">
            <md-icon slot="icon">arrow_back</md-icon>
            Back to List
          </md-outlined-button>
        </div>

        <sky-card variant="outlined" class="w-full p-6 bg-white border border-slate-200 rounded-xl shadow-sm">
          <div class="flex flex-col gap-y-6 w-full">
            <sky-card class="p-6 block">
              <div class="section-heading-box"><h3>1. Trip Type Details</h3></div>
              <div class="grid grid-cols-2 gap-4 max-sm:grid-cols-1 w-full">
                <md-outlined-text-field label="Name *" required [value]="inputName()" (input)="inputName.set($any($event.target).value)"></md-outlined-text-field>
                <md-outlined-select label="Status" [value]="inputIsActive() ? 'Active' : 'Inactive'" (change)="inputIsActive.set($any($event.target).value === 'Active')">
                  <md-select-option value="Active"><div slot="headline">Active</div></md-select-option>
                  <md-select-option value="Inactive"><div slot="headline">Inactive</div></md-select-option>
                </md-outlined-select>
                <md-outlined-text-field class="col-span-2 max-sm:col-span-1" label="Description" [value]="inputDescription()" (input)="inputDescription.set($any($event.target).value)"></md-outlined-text-field>
              </div>
            </sky-card>
          </div>

          <div class="flex justify-end gap-3 mt-8 border-t border-slate-100 pt-4">
            <md-outlined-button (click)="cancelEdit()">Cancel</md-outlined-button>
            <md-filled-button (click)="saveOption()" style="--md-filled-button-container-color: #2e7d32; --md-filled-button-label-text-color: white;">
              <md-icon slot="icon">save</md-icon>
              {{ editingId() !== null && editingId() !== 'new' ? 'Save Changes' : 'Save Trip Type' }}
            </md-filled-button>
          </div>
        </sky-card>
      </div>
    }
  </div>
</md-admin-page>
