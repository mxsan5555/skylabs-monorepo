<md-admin-page title="Health Document" subtitle="Manage configuration values for driver health verification certificates.">
  <div class="relative w-full">
    
    <!-- VIEW 1: DATA TABLE LIST -->
    @if (!showAddForm()) {
      <div class="w-full mt-4">
        <sky-card class="p-6 block">
          <sky-data-table
            [columns]="tableColumns"
            [rows]="tableRowsString()"
            [total]="options().length"
            selectable
            exportable
            searchable
            [actions]="tableActions"
            (sky-dt-row-action)="onRowAction($event)"
            caption="Health Verification Documents Database"
          >
            <!-- Projected Add button next to download/export button in the toolbar -->
            <md-icon-button
              slot="toolbar-actions"
              aria-label="Add Option"
              title="Add Option"
              (click)="startAdd()"
            >
              <md-icon>add</md-icon>
            </md-icon-button>
          </sky-data-table>
        </sky-card>
      </div>
    }

    <!-- VIEW 2: ADD / EDIT FORM VIEW -->
    @else {
      <div class="flex flex-col gap-6 w-full mt-2">
        <!-- Breadcrumb / Back Button bar -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <div class="text-xs text-slate-500 font-semibold tracking-wide">
            Home / <span class="text-[#2e7d32]">{{ editingId() !== null && editingId() !== 'new' ? 'Edit Option' : 'Add Option' }}</span>
          </div>
          <md-outlined-button (click)="cancelEdit()">
            <md-icon slot="icon">arrow_back</md-icon>
            Back to List
          </md-outlined-button>
        </div>

        <sky-card variant="outlined" class="w-full p-6 bg-white border border-slate-200 rounded-xl shadow-sm block">
          <div class="flex flex-col gap-y-6 w-full">
            <sky-card class="p-6 block">
              <div class="section-heading-box">
                <h3>1. Option Details</h3>
              </div>
              <div class="grid grid-cols-2 gap-4 max-sm:grid-cols-1 w-full">
                <md-outlined-text-field label="Option Value / Label *" [value]="inputName()" (input)="inputName.set($any($event.target).value)" placeholder="Enter option name"></md-outlined-text-field>

                <md-outlined-select label="Status *" [value]="inputStatus()" (change)="inputStatus.set($any($event.target).value)">
                  <md-select-option value="Active"><div slot="headline">Active</div></md-select-option>
                  <md-select-option value="Inactive"><div slot="headline">Inactive</div></md-select-option>
                </md-outlined-select>
              </div>
            </sky-card>
          </div>

          <div class="flex gap-2 mt-6 justify-end border-t border-slate-100 pt-4">
            <md-outlined-button (click)="cancelEdit()">Cancel</md-outlined-button>
            <md-filled-button (click)="saveOption()" style="--md-filled-button-container-color: #2e7d32; --md-filled-button-label-text-color: white;">
              <md-icon slot="icon">save</md-icon> Save
            </md-filled-button>
          </div>
        </sky-card>
      </div>
    }

  </div>
</md-admin-page>
