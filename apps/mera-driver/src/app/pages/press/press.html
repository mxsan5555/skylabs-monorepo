<main class="w-full max-w-[1280px] mx-auto px-3 sm:px-6 py-8 flex flex-col gap-12">

  <!-- 01. HEADER SECTION -->
  <header class="flex flex-col gap-3 text-left">
    <sky-badge variant="primary" class="self-start rounded-none tracking-wider font-bold uppercase">
      {{ content().badge }}
    </sky-badge>

    <h1 class="m-0 text-3xl sm:text-4xl md:text-5xl font-extrabold text-[var(--md-sys-color-on-surface)] tracking-tight leading-tight">
      {{ content().title }}
    </h1>

    <p class="m-0 text-sm sm:text-base text-[var(--md-sys-color-on-surface-variant)] max-w-2xl leading-relaxed">
      {{ content().subtitle }}
    </p>
  </header>

  <!-- 02. PRESS ARTICLES GRID -->
  <section class="w-full">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
      @for (article of content().articles; track article.id) {
        <a routerLink="/press-detail" class="no-underline text-inherit block h-full">
          <sky-card variant="outlined" class="block w-full rounded-none h-full hover:border-[var(--md-sys-color-primary)] transition-colors cursor-pointer">
            <article class="flex flex-col h-full justify-between">
              <div>
                <img
                  [src]="article.image"
                  [alt]="article.publisher"
                  class="w-full aspect-[16/10] object-cover rounded-none block shadow-sm"
                  loading="lazy"
                />

                <div class="p-5 flex flex-col gap-3 text-left">
                  <p class="m-0 text-xs sm:text-sm text-[var(--md-sys-color-on-surface-variant)] leading-relaxed line-clamp-4">
                    {{ article.snippet }}
                  </p>
                </div>
              </div>

              <!-- Publisher, Date & Know More Link -->
              <div class="p-5 pt-0 text-left">
                <div class="pt-3 border-t border-[var(--md-sys-color-outline-variant)] flex items-center justify-between">
                  <div class="flex flex-col gap-0.5">
                    <span class="text-xs font-semibold text-[var(--md-sys-color-primary)]">
                      {{ article.publisher }}
                    </span>
                    <span class="text-[10px] text-[var(--md-sys-color-on-surface-variant)]">{{ article.publishedDate }}</span>
                  </div>

                  <span class="inline-flex items-center gap-0.5 text-xs font-bold text-[var(--md-sys-color-primary)]">
                    {{ content().linkText }}
                    <md-icon class="text-sm">chevron_right</md-icon>
                  </span>
                </div>
              </div>
            </article>
          </sky-card>
        </a>
      }
    </div>
  </section>

</main>
