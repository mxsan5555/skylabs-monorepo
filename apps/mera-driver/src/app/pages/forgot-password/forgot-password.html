<div class="auth-screen">
  <div class="auth-brand">
    <div class="auth-brand__logo">
      <md-icon aria-hidden="true">lock_reset</md-icon>
    </div>
    <h1 class="auth-brand__title">mera-driver</h1>
    <p class="auth-brand__subtitle">Reset your password</p>
  </div>

  <div class="auth-card">
    <h2>Forgot password</h2>
    <p>Enter your email or phone number and we'll send you a reset code.</p>

    <md-outlined-text-field class="auth-field" label="Email or phone" [value]="value" (input)="onInput($any($event.target).value)">
      <md-icon slot="leading-icon" aria-hidden="true">person</md-icon>
    </md-outlined-text-field>

    @if (error()) {
      <p class="auth-error" role="alert">{{ error() }}</p>
    }

    <md-filled-button class="auth-submit" [disabled]="loading()" (click)="sendResetCode()">
      {{ loading() ? 'Sending…' : 'Send reset code' }}
    </md-filled-button>

    <md-text-button type="button" class="auth-submit" (click)="back()">Back to sign in</md-text-button>
  </div>
</div>
