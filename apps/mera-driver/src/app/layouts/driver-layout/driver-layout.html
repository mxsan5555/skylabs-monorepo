<div class="admin-layout" [class.is-collapsed]="collapsed()">
  @if (!collapsed()) { <button type="button" class="admin-sidebar-backdrop" aria-label="Close navigation" (click)="closeSidebar()"></button> }
  <md-driver-sidebar [open]="!collapsed()" (close)="closeSidebar()"></md-driver-sidebar>
  <div class="admin-main" [attr.inert]="mobileMenuOpen() ? '' : null">
    <div class="admin-topbar">
      <md-icon-button
        [attr.aria-label]="collapsed() ? 'Show navigation' : 'Hide navigation'"
        (click)="toggleSidebar()"
      >
        <md-icon aria-hidden="true">dock_to_right</md-icon>
      </md-icon-button>
      <nav aria-label="Breadcrumb">
        <ol class="admin-breadcrumb">
          <li>Driver Portal</li>
          @if (currentLabel()) {
            <li aria-current="page">{{ currentLabel() }}</li>
          }
        </ol>
      </nav>
      <md-icon-button aria-label="Log out" title="Log out" (click)="signOut()">
        <md-icon aria-hidden="true">logout</md-icon>
      </md-icon-button>
    </div>
    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
    <nav class="rider-nav driver-rider-nav" aria-label="Primary">
      <button
        type="button"
        class="rider-nav__item"
        [class.active]="isActive('/driver')"
        [attr.aria-current]="isActive('/driver') ? 'page' : null"
        (click)="go('/driver')"
      >
        <md-icon aria-hidden="true">home</md-icon>
        Home
      </button>
      <button
        type="button"
        class="rider-nav__item"
        [class.active]="isActive('/driver/profile')"
        [attr.aria-current]="isActive('/driver/profile') ? 'page' : null"
        (click)="go('/driver/profile')"
      >
        <md-icon aria-hidden="true">person</md-icon>
        Profile
      </button>
      <button
        type="button"
        class="rider-nav__item"
        [class.active]="isActive('/driver/kyc')"
        [attr.aria-current]="isActive('/driver/kyc') ? 'page' : null"
        (click)="go('/driver/kyc')"
      >
        <md-icon aria-hidden="true">verified_user</md-icon>
        KYC
      </button>
      <button
        type="button"
        class="rider-nav__item"
        [class.active]="isActive('/driver/documents')"
        [attr.aria-current]="isActive('/driver/documents') ? 'page' : null"
        (click)="go('/driver/documents')"
      >
        <md-icon aria-hidden="true">folder</md-icon>
        Documents
      </button>
      <button
        type="button"
        class="rider-nav__item"
        [class.active]="isActive('/driver/support')"
        [attr.aria-current]="isActive('/driver/support') ? 'page' : null"
        (click)="go('/driver/support')"
      >
        <md-icon aria-hidden="true">support_agent</md-icon>
        Support
      </button>
    </nav>
  </div>
</div>
